org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project (D:) and the pub cache (C:) are on different drives on the build machine;
# Kotlin incremental caches cannot relativize such paths, so compile plugins non-incrementally.
kotlin.incremental=false
