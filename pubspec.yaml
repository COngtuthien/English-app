name: ielts_vocabulary_master
description: "IELTS Vocabulary Master - offline IELTS vocabulary trainer for Vietnamese learners"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_tts: ^4.2.5
  fsrs: ^2.0.1
  fl_chart: ^1.3.1
  intl: ^0.20.2
  file_picker: ^13.4.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  collection: ^1.19.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/images/
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#4338CA"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F5F6FB"
  image: assets/images/splash_logo.png
  color_dark: "#121418"
  image_dark: assets/images/splash_logo.png
  android_12:
    image: assets/images/splash_logo_android12.png
    color: "#F5F6FB"
    color_dark: "#121418"
  web: false
  ios: false
